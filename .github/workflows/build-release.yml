name: Build theme release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Read theme version
        id: theme
        shell: bash
        run: |
          VERSION="$(sed -n 's/^ *Version: *//p' style.css | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$VERSION" = "${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package theme-only ZIP
        shell: bash
        run: |
          mkdir -p dist/medicare-leads-hub
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/medicare-leads-hub/
          cd dist
          zip -qr "../medicare-leads-hub-${{ steps.theme.outputs.version }}.zip" medicare-leads-hub

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.theme.outputs.version }}"
          PACKAGE="medicare-leads-hub-${{ steps.theme.outputs.version }}.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --title "Medicare Leads Hub ${{ steps.theme.outputs.version }}" --generate-notes
          fi
