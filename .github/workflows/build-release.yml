name: Build theme release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Read theme version
        id: theme
        shell: bash
        run: |
          VERSION="$(sed -n 's/^ *Version: *//p' style.css | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          test "$VERSION" = "${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package theme-only ZIP
        shell: bash
        run: |
          mkdir -p dist/medicare-leads-hub
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/medicare-leads-hub/
          cd dist
          zip -qr "../medicare-leads-hub-${{ steps.theme.outputs.version }}.zip" medicare-leads-hub

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "medicare-leads-hub-${{ steps.theme.outputs.version }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Medicare Leads Hub ${{ steps.theme.outputs.version }}" \
            --generate-notes
